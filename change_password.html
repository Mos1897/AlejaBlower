<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/change_password.css">
    <title>Change Password - Aleja Blower</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Change Password</h2>
            <p>Create a strong password to secure your account</p>
            
            <form id="changePasswordForm">
                <label for="newPassword">New Password</label>
                <div class="password-container">
                    <input type="password" id="newPassword" placeholder="Enter new password" required />
                    <i class="fas fa-eye toggle-password" id="toggleNewPassword"></i>
                </div>
                
                <div class="password-requirements-box">
                    <h4>Password Requirements:</h4>
                    <div id="passwordRequirements" class="password-requirements">
                        <div class="requirement" id="length-req">
                            <i class="fas fa-times"></i>
                            <span>12-16 characters long</span>
                        </div>
                        <div class="requirement" id="uppercase-req">
                            <i class="fas fa-times"></i>
                            <span>One uppercase letter</span>
                        </div>
                        <div class="requirement" id="lowercase-req">
                            <i class="fas fa-times"></i>
                            <span>One lowercase letter</span>
                        </div>
                        <div class="requirement" id="number-req">
                            <i class="fas fa-times"></i>
                            <span>One number</span>
                        </div>
                        <div class="requirement" id="special-req">
                            <i class="fas fa-times"></i>
                            <span>One special character</span>
                        </div>
                    </div>
                </div>
                
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-container">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
                    <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
                </div>
                
                <div id="passwordMatch" class="password-match-indicator" style="display: none;">
                    <i class="fas fa-times"></i>
                    <span>Passwords do not match</span>
                </div>
                
                <button type="submit">Change Password</button>
            </form>
            
            <a href="/laundry/html/index.html" class="back-link">Back to Login</a>
        </div>
    </div>

    <script src="../scripts/change_password_script.js"></script>
</body>
</html>

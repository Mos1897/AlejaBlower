<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.1/css/all.min.css">
    <link rel="stylesheet" href="/styles/forgot_password.css">
    <title>Forgot Password</title>
</head> 
<body> 
	<div class="container">
 		<div class="card"> 
			<div class="icon"> 
       			         <i class="fa-solid fa-user-lock"></i>
			</div>
 			<h2>Forgot Password?</h2> 
            <p>Enter your email address and we’ll send you a link to reset your password.</p>
                <form id="forgotPasswordForm" novalidate autocomplete="off" onsubmit="return false;"> 
                    <label for="email">Email Address</label> 
                    <input type="text" id="email" name="email" placeholder="Enter your email" autocomplete="email" /> 
                    <button type="button" id="sendResetButton">Send Reset Link</button> 
                </form> 

                <a href="/laundry/html/index.html" class="back-link">Back to Login</a> 
	    </div> 
	</div> 

    <!-- cache-busting query string ensures latest script is fetched -->
    <script src="/scripts/forgot_password_script.js?v=2"></script>
</body>
</html>
